name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobintel
          POSTGRES_PASSWORD: localdevpassword
          POSTGRES_DB: job_market
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jobintel -d job_market"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://jobintel:localdevpassword@localhost:5433/job_market
      JWT_SECRET_KEY: ci-test-secret
      REDIS_URL: redis://localhost:6379/0
      # test_skill_graph.py needs a database with nothing in it but what
      # each test seeds itself — job_market is shared with the rest of the
      # suite and gets seed_test_data.py's fixture rows, which the graph
      # tests' exact-count assertions can't coexist with. See the comment
      # atop test_skill_graph.py for the full reasoning.
      SKILL_GRAPH_TEST_DATABASE_URL: postgresql+psycopg2://jobintel:localdevpassword@localhost:5433/job_market_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU-only torch (avoids pulling multi-GB CUDA packages)
        working-directory: backend
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Warm semantic role-matching model cache
        working-directory: backend
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Create and initialize the dedicated skill-graph test database
        working-directory: backend
        run: |
          PGPASSWORD=localdevpassword psql -h localhost -p 5433 -U jobintel -d job_market -c "CREATE DATABASE job_market_test;"
          DATABASE_URL="$SKILL_GRAPH_TEST_DATABASE_URL" python -c "from models import Base, engine; Base.metadata.create_all(engine)"

      - name: Seed fixture data
        working-directory: backend
        run: python seed_test_data.py

      - name: Train salary model
        working-directory: backend
        run: python train_salary_model.py

      - name: Run tests
        working-directory: backend
        run: pytest -v
