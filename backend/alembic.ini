# Production-ready Alembic configuration file.

[alembic]
# Path to migration scripts relative to this file
script_location = %(here)s/migrations

# Date/time prefixed filenames for clear sequential ordering (e.g., 2026_08_31_1509-a1b2c3d4_add_users)
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Sys.path configuration
prepend_sys_path = .
path_separator = os

# Timezone rendering for migration dates (requires `pip install "alembic[tz]"`)
timezone = UTC

# Truncate long migration slug descriptions
truncate_slug_length = 40

# Execute environment code during `alembic revision`
revision_environment = false

# File output encoding
output_encoding = utf-8

# Overridden dynamically at runtime inside env.py via DATABASE_URL
sqlalchemy.url = 


[post_write_hooks]
# Automated code formatting and linting on newly generated migration scripts
hooks = ruff, black

# Ruff auto-fix & import sorting
ruff.type = exec
ruff.executable = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

# Black formatting
black.type = exec
black.executable = black
black.options = REVISION_SCRIPT_FILENAME


# Logging Configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S