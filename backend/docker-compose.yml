services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jobintel
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: job_market
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobintel -d job_market"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
      DATABASE_URL: postgresql+psycopg2://jobintel:localdevpassword@db:5432/job_market
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in your .env before running docker compose}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # No curl/wget in the python:3.12-slim base image — urllib is already there.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  scheduler:
    build: .
    command: python scheduler.py
    environment:
      DATABASE_URL: postgresql+psycopg2://jobintel:localdevpassword@db:5432/job_market
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      INGESTION_CRON: ${INGESTION_CRON:-0 3 * * *}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
