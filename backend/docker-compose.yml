services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jobintel
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: job_market
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobintel -d job_market"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
      DATABASE_URL: postgresql+psycopg2://jobintel:localdevpassword@db:5432/job_market
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in your .env before running docker compose}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
