[pytest]
# Directory and file pattern filtering
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Command-line options:
# - ignore manual/heavy NLP debug scripts requiring extra dependencies
# - verbosity and clear short test summary outputs
# - strict marker validation to prevent typos
addopts = 
    --ignore=test_skillner.py
    --strict-markers
    --tb=short
    -ra

# Custom test markers for selective execution (e.g., pytest -m "not integration")
markers =
    unit: Fast unit tests isolated from external dependencies or DB.
    integration: Database or external service integration tests.
    slow: Long-running tests or heavy batch operations.

# Warning filters
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning:spacy.*

# Environment variables setup for testing
env =
    TESTING=true
    DATABASE_URL=sqlite:///:memory: